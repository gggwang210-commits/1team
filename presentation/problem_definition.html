<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문제 정의: 왜 허리 통증 예측이 중요한가?</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: #FFFFFF; color: #0F172A; }
        .slide-container { width: 1280px; min-height: 720px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; padding: 80px 48px 24px; text-align: center; }
        .slide-title { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 32px; line-height: 1.2; color: #0F172A; margin-bottom: 28px; text-align: left; width: 100%; }
        .content-wrapper { display: flex; flex-direction: column; align-items: flex-start; width: 100%; text-align: left; }
        .bullet-point { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 20px; line-height: 1.6; color: #0F172A; margin-bottom: 12px; display: flex; align-items: flex-start; }
        .bullet-point::before { content: '\2022'; color: #0F172A; font-weight: 900; display: inline-block; width: 1em; margin-left: -1em; }
    </style>
</head>
<body>
    <div class="slide-container">
        <h2 class="slide-title">문제 정의: 왜 허리 통증 예측이 중요한가?</h2>
        <div class="content-wrapper">
            <p class="bullet-point">요통은 전 세계적으로 장애 부담이 가장 큰 질환 중 하나 (WHO 근거)</p>
            <p class="bullet-point">생활습관(수면, 활동, 흡연)과 신체 지표(BMI, 허리둘레)를 통해 위험군을 사전에 스크리닝할 수 있는가?</p>
        </div>
    </div>
</body>
</html>
